name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # dist/ and llms.txt are committed; fail if they don't match the source
      - name: Check generated files are up to date
        run: |
          if ! git diff --exit-code -- dist llms.txt; then
            echo "dist/ or llms.txt is out of date. Run npm run build and commit the result."
            exit 1
          fi
