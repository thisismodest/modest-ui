name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # dist/ and llms.txt are committed; fail if they don't match the source
      - name: Check generated files are up to date
        run: |
          if ! git diff --exit-code -- dist llms.txt; then
            echo "dist/ or llms.txt is out of date. Run npm run build and commit the result."
            exit 1
          fi
