name: Publish to npm

# Publishes when a version tag (v1.2.3) is pushed, and only then: the tag must be
# on main and match package.json. The publish job runs in the `npm` environment,
# which accepts only v* tags, and npm trusts only this repository, workflow, and
# environment (trusted publishing: no token stored; provenance is automatic).
# Actions are pinned to exact commits, and dependencies install without running
# their scripts while the job can publish.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later. Pinned to an exact npm 11:
      # npm@12.0.0's global install shipped a broken provenance path (missing
      # bundled 'sigstore').
      - name: Upgrade npm
        run: npm install --global npm@11.21.1

      - name: Check the tag matches package.json and is on main
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build bundle
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

  # A GitHub Release from the tag, in its own job: the write access it needs is
  # never held while dependencies are installed or the package is published.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
